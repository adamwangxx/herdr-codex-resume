id = "adam.herdr-codex-resume"
name = "Codex Resume"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Resume Codex in a new Herdr split and preserve live Herdr context in shell tools."
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Codex: resume in a new split"
contexts = ["pane"]
command = ["sh", "scripts/herdr-codex-resume", "open"]

[[actions]]
id = "setup-keybinding"
title = "Codex: install resume keybinding"
command = ["sh", "scripts/setup-keybinding"]
