name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell syntax
        run: |
          sh -n scripts/herdr-codex-resume
          sh -n tests/run.sh
          sh -n tests/fixtures/herdr
          sh -n tests/fixtures/codex

      - name: Run tests
        run: sh tests/run.sh

      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          manifest_version=$(awk -F'"' '/^version = / { print $2; exit }' herdr-plugin.toml)
          test "v${manifest_version}" = "${GITHUB_REF_NAME}"
